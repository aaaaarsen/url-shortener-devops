<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Shortener</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  input, button { font-size: 16px; padding: 8px; }
  input[type=text] { width: 100%; box-sizing: border-box; margin-bottom: 8px; }
  button { cursor: pointer; }
  #result { margin-top: 16px; padding: 12px; background: #f4f4f4; border-radius: 6px; display: none; }
  #result a { word-break: break-all; }
  .stats { font-size: 14px; color: #555; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Сократить ссылку</h1>
  <input type="text" id="urlInput" placeholder="https://example.com/very/long/url">
  <button id="shortenBtn">Сократить</button>

  <div id="result">
    <div>Короткая ссылка: <a id="shortLink" href="#" target="_blank"></a></div>
    <div class="stats">Переходов: <span id="clickCount">0</span> <button id="refreshBtn">обновить</button></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
